[project]
name = "netsight"
version = "0.1.0"
description = "Independent, sensor-neutral assurance for sonar survey contacts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3",
    "pyxtf==1.5.0",
    "rasterio>=1.5,<1.6",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "pypdf>=5",
]

[project.optional-dependencies]
# Detector training/inference (Step 2B). torch/torchvision come from the CUDA 12.8 index.
ml = [
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.51",
    "safetensors>=0.4",
    "pillow>=10",
]
app = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
netsight = "netsight.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.hatch.build.targets.wheel]
packages = ["src/netsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
